name: Serverless Framework Deployment - HMG

on:
  push:
    branches: [ "hmg" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Create env file
      run: |
        touch .env
        echo TESTE=${{ secrets.TESTE }} >> .env
        echo .env
        cat .env
