# Serverless Framework specific syntax
check-authorizer:
  handler: src/functions/auth/checkAuthorizer.handler

healthcheck:
  handler: src/functions/healthcheck.handler
  description: Verificação de saúde para garantir que o serviço esteja funcionando
  events:
    - http:
        path: healthcheck
        method: GET

transactionStatusDesignations:
  handler: src/functions/designations/transactionStatusDesignations.handler
  description: Atualizar status de designações
  enabled: false
  events: # BR 06:35, 10:35, 13:05, 17:05, 20:00, 22:00
    - schedule: cron(35 9 ? * * *) # Para BR seria 06:35
    - schedule: cron(35 13 ? * * *) # Para BR seria 10:35
    - schedule: cron(10 16 ? * * *) # Para BR seria 13:05
    - schedule: cron(10 20 ? * * *) # Para BR seria 17:05
    - schedule: cron(0 23 ? * * *) # Para BR seria 20:00
    - schedule: cron(0 1 ? * * *) # Para BR seria 22:00

whatsappMessageHandler:
  handler: src/functions/whatsapp/handler.handler
  description: Consumidor de mensagens do WhatsApp com cadência humana
  events:
    - sqs:
        arn: !GetAtt WhatsAppMessageQueue.Arn
        batchSize: 1 # Processar uma mensagem por vez para facilitar o controle de cadência humana

testSqsWhatsapp:
  handler: src/functions/whatsapp/testSqsWhatsapp.handler
  description: Endpoint de teste para envio SQS (Human Delay)
  events:
    - http:
        path: test/sqs-whatsapp
        method: POST
        cors: true

webhookZapiConnected:
  handler: src/functions/webhooks/zapi/handler.handleConnected
  description: Webhook para receber evento de conexão da Z-API
  events:
    - http:
        path: webhooks/zapi/connected
        method: POST
        cors: true

webhookZapiDisconnected:
  handler: src/functions/webhooks/zapi/handler.handleDisconnected
  description: Webhook para receber evento de desconexão da Z-API
  events:
    - http:
        path: webhooks/zapi/disconnected
        method: POST
        cors: true
